# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# ── MCP servers ─────────────────────────────────────────────────────────────
# Host plane by choice, so every session sees these tools regardless of preset.
# One row per server: `dsh-mcp-client` connects one instance to one server and
# registers its tools as `mcp__<serverName>__<tool>`. It injects only `tools`
# and provides no service, so no isolate realm is involved.
#
# The transport is the proxy that swap/start.sh launches
# (`uvx mcp-proxy --named-server-config config_mcp.json --port 8001 --stateless`),
# which serves each named server at /servers/<name>/mcp over Streamable HTTP —
# the transport this plugin speaks. Verified live: `initialize` and `tools/list`
# answer on every row (time, fetch, ddg-search, freecad, browser-mcp, blender), and
# `--stateless` means no session id to carry. Reusing it
# avoids a second copy of each Python server per harness process.
#
# `failOnStartupError` stays false (the default) on purpose: the proxy is a
# separate manual process, so a boot without it must still start the harness.
# The server's tools then simply do not appear, and `reconnect` (also default)
# retries the link. Set it true on a row to make a missing proxy a startup error.
#
# Overlaps worth knowing: `mcp__fetch__fetch` duplicates the built-in
# `web_fetch`, which needs no credential either. `mcp__ddg-search__search`
# duplicates `web_search` — which currently CANNOT work, since the `web` row's
# `searchProvider: deepseek-official` needs a DEEPSEEK_API_KEY that is neither in
# the credential store nor the environment. Until that key exists, ddg-search is
# the only working search here.

- insert:
    - id: mcp-time
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: time
        transport: streamable-http
        url: http://127.0.0.1:8001/servers/time/mcp

    - id: mcp-fetch
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: fetch
        transport: streamable-http
        url: http://127.0.0.1:8001/servers/fetch/mcp

    - id: mcp-ddg-search
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ddg-search
        transport: streamable-http
        url: http://127.0.0.1:8001/servers/ddg-search/mcp
        # DuckDuckGo is reached through the public endpoint and can answer slowly
        # under load; the 60s default is kept explicit so it reads as a decision.
        toolCallTimeoutMs: 60000

    - id: mcp-freecad
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: freecad
        transport: streamable-http
        url: http://127.0.0.1:8001/servers/freecad/mcp
        # FreeCAD's own execute_code budget is 90s (extendable to 1800s) and FEM
        # runs go longer, so the 60s client default would time out while the
        # addon is still working. Two minutes stays above the addon's default.
        toolCallTimeoutMs: 120000
        # mcp-proxy reads config_mcp.json only at startup, so this link can fail
        # until swap/start.sh is restarted; keep retrying well past a manual
        # restart instead of giving up at the 10-attempt default.
        reconnect:
          maxAttempts: 60

    - id: mcp-blender
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: blender
        transport: streamable-http
        url: http://127.0.0.1:8001/servers/blender/mcp
        # The server's own budget to the Blender add-on is 300 s (blmcp's socket
        # timeout) and its headless `blender --background` fallback is 120 s, so a
        # viewport render or an execute_blender_code pass on a heavy scene runs for
        # minutes. The 60 s client default cuts the call off mid-render.
        toolCallTimeoutMs: 300000
        # Needs Blender running with the MCP add-on enabled (it listens on
        # localhost:9876). Without Blender the server starts happily and every tool
        # answers "Cannot connect to Blender", so the row is harmless when Blender is
        # closed - and the retry window covers a proxy restart as on the rows above.
        reconnect:
          maxAttempts: 60

    - id: mcp-browser
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: browser-mcp
        transport: streamable-http
        url: http://127.0.0.1:8001/servers/browser-mcp/mcp
        # browser_ask_user waits 120s for a human to answer a 2FA/CAPTCHA prompt
        # (and the server itself allows 125s), so the 60s client default would
        # time out on precisely the tool whose job is handing control to a person.
        toolCallTimeoutMs: 180000
        # Same as freecad: the proxy reads config_mcp.json only at startup, so a
        # manual restart of swap/start.sh must stay inside the retry window.
        reconnect:
          maxAttempts: 60

    - id: mcp-dfhack
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: dfhack
        transport: streamable-http
        url: http://127.0.0.1:8000/mcp
        # Not behind the 8001 proxy. dfhack-mcp is a FastAPI app that speaks
        # Streamable HTTP on its own (mcp.mount_http() at /mcp), so this row talks
        # to it directly, the way the WordPress row below does - no copy of the
        # server per harness process, and nothing in swap/start.sh has to be
        # restarted to add it.
        # A loaded fortress with thousands of dwarves makes get_unit_list and
        # get_material_list serialize large protobuf payloads over the DFHack RPC
        # socket, so stay above the 60s default.
        toolCallTimeoutMs: 120000
        # Manual process, started after the game:
        #   cd ~/github/dfhack-mcp && uv run python main.py   # 127.0.0.1:8000
        # It needs Dwarf Fortress running with DFHack's remote-server plugin on
        # 127.0.0.1:5000, and its lifespan connects once at startup - so start it
        # after the game, not before. failOnStartupError stays false so a harness
        # boot without the game still starts and the tools simply stay absent;
        # the long retry window covers a manual restart of game and server. A patch
        # edit re-creates the plugin instance, which is the way back from an exhausted
        # reconnect loop (see the restart note in ~/github/dfhack-mcp/SETUP-LINUX.md).
        reconnect:
          maxAttempts: 60
